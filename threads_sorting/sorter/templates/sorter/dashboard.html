<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сортировка в потоках</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 10px 0; }
        .card h3 { margin-top: 0; }
        progress { width: 100%; height: 20px; accent-color: #4C9F50; }
        .status { font-weight: bold; }
        .result { font-family: monospace; font-size: 0.9em; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Сортировка в четырёх потоках</h1>
    <p><strong>Исходный список:</strong> {{ original }}</p>

    {% for algo in algorithms %}
        <div class="card" id="card-{{ algo }}">
            <h3>{{ algo|capfirst }}</h3>
            <p>Статус: <span class="status" id="status-{{ algo }}">idle</span></p>
            <progress id="progress-{{ algo }}" value="0" max="100"></progress>
            <p class="result" id="result-{{ algo }}">—</p>
        </div>
    {% endfor %}

    <script>
        async function refreshStatus() {
            try {
                const resp = await fetch('/api/status/');
                const data = await resp.json();
                for (const [name, state] of Object.entries(data)) {
                    const statusEl = document.getElementById('status-' + name);
                    const progressEl = document.getElementById('progress-' + name);
                    const resultEl = document.getElementById('result-' + name);
                    if (statusEl) statusEl.textContent = state.status;
                    if (progressEl) progressEl.value = state.progress || 0;
                    if (resultEl) {
                        if (state.result) {
                            resultEl.textContent = Array.isArray(state.result)
                                ? JSON.stringify(state.result)
                                : state.result;
                        } else {
                            resultEl.textContent = '—';
                        }
                    }
                }
            } catch (e) {
                console.error('Ошибка обновления статуса:', e);
            }
        }
        setInterval(refreshStatus, 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ThreadsSorting{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; }
        nav { background: #333; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        nav a { color: #fff; text-decoration: none; margin-right: 20px; }
        nav a:hover { text-decoration: underline; }
        nav a.active { font-weight: bold; text-decoration: underline; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 10px 0; }
        .card h3 { margin-top: 0; }
        progress { width: 100%; height: 20px; accent-color: #4C9F50; }
        .status { font-weight: bold; }
        .common { font-family: monospace; font-size: 0.9em; word-break: break-all; }
        .result { font-family: monospace; font-size: 0.9em; word-break: break-all; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">Дашборд</a>
        <a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">О проекте</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
